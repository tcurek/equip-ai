services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: equip
      POSTGRES_PASSWORD: equip
      POSTGRES_DB: equip_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equip -d equip_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
